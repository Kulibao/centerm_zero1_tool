# SATA LED settings managed by T-NAS Zero1tool.
# 1: blink green while a disk is in standby; 0: solid green while in standby.
STANDBY_BLINK=1
# 1: manage the corresponding disk LEDs; 0: keep both LEDs for that slot off.
LED1_ENABLED=1
LED2_ENABLED=1
# 1: green power LED on; 0: both power LED colors off.
POWER_LED_ENABLED=1
# Daily indicator shutdown schedule; times use 24-hour HH:MM format.
LED_SCHEDULE_ENABLED=0
LED_SCHEDULE_START=23:00
LED_SCHEDULE_END=07:00
# Scheduled targets default to both SATA slots; power LED stays unaffected.
LED_SCHEDULE_POWER=0
LED_SCHEDULE_SATA1=1
LED_SCHEDULE_SATA2=1
